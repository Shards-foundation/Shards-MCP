[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shards-mcp"
version = "0.1.0"
description = "A governed, durable agent-to-agent communication gateway with MCP transport"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Shards Foundation"}]
keywords = ["mcp", "agents", "gateway", "audit", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
oauth = ["PyJWT[crypto]>=2.10.1,<3"]

[project.scripts]
shards-mcp = "shards_mcp.server:main"
shards-worker = "shards_mcp.worker:main"
shards-mcp-stdio = "shards_mcp.stdio:main"
shards-mcp-admin = "shards_mcp.admin:main"
shards-mcp-doctor = "shards_mcp.doctor:main"
shards-mcp-connect = "shards_mcp.connect:main"
shards-a2a-doctor = "shards_mcp.a2a_doctor:main"
shards-scheduler = "shards_mcp.scheduler:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
