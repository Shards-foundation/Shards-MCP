[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shards-mcp"
version = "0.1.0"
description = "A governed, durable agent-to-agent communication gateway with MCP transport"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Shards Foundation"}]
keywords = ["mcp", "agents", "gateway", "audit", "orchestration"]

[project.scripts]
shards-mcp = "shards_mcp.server:main"
shards-worker = "shards_mcp.worker:main"
shards-mcp-stdio = "shards_mcp.stdio:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
