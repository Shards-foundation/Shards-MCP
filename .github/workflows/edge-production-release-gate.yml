name: Shards MCP post-deployment release gate
# This workflow is deliberately NOT part of source-only PR CI. Invoke after
# deploying a reviewed, pinned Worker version; three-tool production MUST fail.
# bridge_mode defaults to disabled (10 protected tools); enabled expects 11,
# including shards_kernel_issue_label. Anonymous discovery is always 9 public.
on:
  workflow_dispatch:
    inputs:
      deployed_worker_version:
        description: "Actual deployed Cloudflare Worker version UUID (required evidence)"
        required: true
        type: string
      bridge_mode:
        description: "Expected protected-tool mode: disabled (10 tools) or enabled (11 tools, includes shards_kernel_issue_label)"
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - enabled
permissions:
  contents: read
jobs:
  live-nine-tool-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use exact reviewed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: deployment/cloudflare/.node-version
      - name: Verify input UUID against active Cloudflare deployment and custom domain
        env:
          SHARDS_CF_ACCOUNT_ID: "7a2355b21ed76c3aa60e8bdf3a9a5c8a"
          SHARDS_CF_READ_TOKEN: ${{ secrets.SHARDS_CF_WORKERS_READ_TOKEN }}
          EXPECTED_WORKER_VERSION: ${{ inputs.deployed_worker_version }}
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.16.0"
          node deployment/cloudflare/verify_release_deployment.mjs
      - name: Validate release evidence and exact public/protected discovery
        env:
          DEPLOYED_WORKER_VERSION: ${{ inputs.deployed_worker_version }}
          EXPECTED_BRIDGE_MODE: ${{ inputs.bridge_mode }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYED_WORKER_VERSION" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "Missing version evidence"; exit 1; }
          curl --fail --silent --show-error --retry 2 https://mcp.shardsinc.co.uk/api/status -o /tmp/mcp-status.json
          curl --fail --silent --show-error --retry 2 -X POST https://mcp.shardsinc.co.uk/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' -o /tmp/mcp-tools.json
          node <<'NODE'
          (async()=>{
            const status=require('/tmp/mcp-status.json');
            const response=require('/tmp/mcp-tools.json');
            const {assertExactNames}=await import('./deployment/cloudflare/release_gate_names.mjs');
            if(status.db!=='connected')throw Error('Production D1 not connected');
            const result=assertExactNames(status.tools||[], response.result?.tools||[], process.env.EXPECTED_BRIDGE_MODE);
            console.log(`PASS: nine exact public names, ${result.expectedPrivate.length} exact private names (bridge ${result.bridgeMode}), no anonymous privileged discovery`);
          })().catch(err=>{console.error(err);process.exitCode=1});
          NODE
      - name: Check real public operations and private-tool denial
        run: |
          set -euo pipefail
          node <<'NODE'
          const url='https://mcp.shardsinc.co.uk/mcp';
          async function call(name,args){
            const res=await fetch(url,{method:'POST',headers:{'content-type':'application/json','accept':'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:name,method:'tools/call',params:{name,arguments:args}}),signal:AbortSignal.timeout(10000),redirect:'error'});
            if(!res.ok)throw Error(name+' transport failed '+res.status);
            return (await res.json()).result;
          }
          const tests=[
            ['shards_skill_search',{query:'security',limit:2}],
            ['shards_skill_read',{slug:'shards-sec-vibecoding-gate'}],
            ['shards_repo_document',{repository:'Shards-MCP',document:'README.md'}],
            ['shards_open_prs',{repository:'Shards-MCP'}]
          ];
          (async()=>{
            for(const [name,args] of tests){
              const out=await call(name,args);
              if(out?.isError!==false || !out?.structuredContent)throw Error(name+' did not return live structured data');
              console.log('PASS '+name);
            }
            const commit=await call('shards_commit_read',{repository:'Shards-MCP',sha:process.env.GITHUB_SHA});
            if(commit?.isError!==false||commit?.structuredContent?.sha!==process.env.GITHUB_SHA)throw Error('shards_commit_read did not return the exact requested SHA');
            console.log('PASS shards_commit_read');
            const pr=await call('shards_pr_read',{repository:'Shards-MCP',number:1});
            if(pr?.isError!==false||pr?.structuredContent?.number!==1||!/^[0-9a-f]{40}$/.test(pr?.structuredContent?.head?.sha||'')||!/^[0-9a-f]{40}$/.test(pr?.structuredContent?.base?.sha||''))throw Error('shards_pr_read did not return exact PR metadata and SHAs');
            console.log('PASS shards_pr_read');
            const blocked=await call('shards_agent_identity',{});
            if(blocked?.isError!==true||!blocked.content?.[0]?.text?.includes('AUTH_REQUIRED'))throw Error('Private tool exposed anonymously');
            console.log('PASS private tool denial; release verification complete');
          })().catch(err=>{console.error(err);process.exitCode=1});
          NODE
      - name: Reconfirm same Cloudflare deployment remains active after all MCP checks
        env:
          SHARDS_CF_ACCOUNT_ID: "7a2355b21ed76c3aa60e8bdf3a9a5c8a"
          SHARDS_CF_READ_TOKEN: ${{ secrets.SHARDS_CF_WORKERS_READ_TOKEN }}
          EXPECTED_WORKER_VERSION: ${{ inputs.deployed_worker_version }}
        run: |
          set -euo pipefail
          node deployment/cloudflare/verify_release_deployment.mjs --compare
