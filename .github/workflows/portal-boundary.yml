name: Cloudflare MCP portal boundary (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/portal_boundary_check.mjs"
      - "scripts/portal_boundary_check.test.mjs"
      - ".github/workflows/portal-boundary.yml"
      - "docs/portal-boundary-acceptance.md"
  workflow_dispatch:
  schedule:
    # Low-volume unauthenticated regression check. Active only if merged to main.
    - cron: '23 9 * * *'
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Deterministic negative and positive fixture tests
        run: node --test scripts/portal_boundary_check.test.mjs
      - name: Check live portal fail-closed behaviour (no OAuth credentials)
        run: node scripts/portal_boundary_check.mjs
