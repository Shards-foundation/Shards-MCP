name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python standard-library package
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install . 'mcp==2.0.0'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Verify official MCP SDK imports
        run: python -c "import mcp, httpx2; from mcp import Client; from mcp.client.streamable_http import streamable_http_client"
      - name: Unit and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Import smoke test
        run: python -c "import shards_mcp; from shards_mcp.server import TOOL_LIST; assert len(TOOL_LIST) >= 15"
      - name: Verify distributable wheel and sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Build Docker image (Python 3.12)
        if: matrix.python-version == '3.12'
        run: |
          docker build --pull -t shards-mcp:ci .
          set +e
          output="$(docker run --rm --network none -e SHARDS_ADMIN_TOKEN=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_ shards-mcp:ci 2>&1)"
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 0 ] || [[ "$output" != *"Refusing non-loopback binding without SHARDS_ALLOW_REMOTE=1"* ]]; then
            echo "Docker startup did not fail for the expected remote-bind security reason"
            exit 1
          fi
      - name: Install wheel in isolated fresh environment
        run: |
          python -m venv /tmp/shards-wheel-env
          /tmp/shards-wheel-env/bin/python -m pip install dist/*.whl
          /tmp/shards-wheel-env/bin/python -c "import shards_mcp; from shards_mcp.server import TOOL_LIST; assert shards_mcp.__version__ == '0.1.0'; assert TOOL_LIST"
          /tmp/shards-wheel-env/bin/shards-worker --help >/dev/null
