name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python standard-library package
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install '.[oauth]' 'mcp==2.0.0'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Verify official MCP SDK imports
        run: python -c "import mcp, httpx2; from mcp import Client; from mcp.client.streamable_http import streamable_http_client"
      - name: Unit and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Cross-runtime end-to-end contract (MCP, stdio, worker, restart)
        run: python -m unittest discover -s tests -p 'test_gateway_e2e.py' -v
      - name: Import smoke test
        run: python -c "import shards_mcp; from shards_mcp.server import TOOL_LIST; assert len(TOOL_LIST) >= 15"
      - name: Verify distributable wheel and sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Build Docker image (Python 3.12)
        if: matrix.python-version == '3.12'
        run: |
          docker build --pull -t shards-mcp:ci .
          set +e
          output="$(docker run --rm --network none -e SHARDS_ADMIN_TOKEN=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_ shards-mcp:ci 2>&1)"
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 0 ] || [[ "$output" != *"Refusing non-loopback binding without SHARDS_ALLOW_REMOTE=1"* ]]; then
            echo "Docker startup did not fail for the expected remote-bind security reason"
            exit 1
          fi
      - name: Verify OAuth image and persistent Compose/Caddy configuration (Python 3.12)
        if: matrix.python-version == '3.12'
        run: |
          docker run --rm --entrypoint python shards-mcp:ci -c "import jwt, cryptography, shards_mcp.scheduler, shards_mcp.snapshots"
          mkdir -p secrets
          chmod 700 secrets
          python -c 'import pathlib,secrets; p=pathlib.Path("secrets/admin_token"); p.write_text(secrets.token_urlsafe(48)); p.chmod(0o600)'
          SHARDS_GATEWAY_DOMAIN=gateway.example.test SHARDS_OAUTH_ISSUER=https://issuer.example.test/ SHARDS_OAUTH_JWKS_URI=https://issuer.example.test/keys.json docker compose -f deploy/compose.yaml config --quiet
          docker run --rm -e SHARDS_GATEWAY_DOMAIN=gateway.example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          rm -f secrets/admin_token
      - name: Install wheel in isolated fresh environment
        run: |
          python -m venv /tmp/shards-wheel-env
          /tmp/shards-wheel-env/bin/python -m pip install dist/*.whl
          /tmp/shards-wheel-env/bin/python -c "import shards_mcp; from shards_mcp.server import TOOL_LIST; assert shards_mcp.__version__ == '0.1.0'; assert TOOL_LIST"
          /tmp/shards-wheel-env/bin/shards-worker --help >/dev/null
          /tmp/shards-wheel-env/bin/shards-scheduler --help >/dev/null
          /tmp/shards-wheel-env/bin/shards-mcp-admin --help >/dev/null
